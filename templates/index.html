
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазин Книг</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Магазин Книг</h1>

            <nav>
                <a href="/">Главная</a>
                <a href="#books">Каталог</a>
                <a href="/login">Войти</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Добро пожаловать в Магазин Книг!</h2>
            <p>Найди книгу по душе.</p>
        </section>

        <section id="books" class="catalog">
            <h2>Наш каталог</h2>

            {{range .}}
                <div class="book">
                    <h3>{{.Title}}</h3>
                    <p>Автор: {{.Author}}</p>
                    <p>Цена: {{.Price}} руб.</p>
                    <p>Количество: {{.Quantity}}</p>
                    <p>Категория: {{.CategoryName}}</p>
                </div>
            {{else}}
                <p>Пока книг нет.</p>
            {{end}}

            <a href="/add-book" class="button">Добавить книгу</a>
        </section>

    </main>

</body>
</html>
